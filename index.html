<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learning OS - Personal Study Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0fdf4',
                            100: '#dcfce7',
                            200: '#bbf7d0',
                            300: '#86efac',
                            400: '#4ade80',
                            500: '#22c55e',
                            600: '#16a34a',
                            700: '#15803d',
                            800: '#166534',
                            900: '#14532d',
                            950: '#052e16',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        /* Custom scrollbar for clean aesthetics */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(107, 114, 128, 0.8);
        }
        .flashcard-container {
            perspective: 1000px;
        }
        .flashcard-inner {
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .flashcard-flipped {
            transform: rotateY(180deg);
        }
        .flashcard-face {
            backface-visibility: hidden;
        }
        .flashcard-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="h-full bg-slate-50 dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-sans antialiased selection:bg-brand-500 selection:text-white overflow-x-hidden">

    <div id="app-root" class="h-full flex flex-col">
        <!-- Rendered dynamically by JavaScript -->
    </div>

    <script>
        /**
         * Learning OS Engine v3.0
         * Reusable Educational Frontend Renderer
         */

        // State management
        const Store = {
            state: {
                currentView: 'home', // home, subjects, lessons, lesson-detail, practice, flashcards, bookmarks, favorites, stats, settings
                currentSubjectId: null,
                currentLessonId: null,
                currentQuiz: null,
                currentFlashcards: null,
                searchQuery: '',
                theme: localStorage.getItem('learning_os_theme') || 'system',
                bookmarks: JSON.parse(localStorage.getItem('learning_os_bookmarks') || '{"lessons":[],"questions":[],"flashcards":[]}'),
                favorites: JSON.parse(localStorage.getItem('learning_os_favorites') || '{"subjects":[],"lessons":[],"questions":[],"flashcards":[]}'),
                progress: JSON.parse(localStorage.getItem('learning_os_progress') || '{"completedLessons":[],"quizScores":{},"flashcardProgress":{},"studyTime":0}'),
                recentLessons: JSON.parse(localStorage.getItem('learning_os_recent') || '[]'),
                settings: JSON.parse(localStorage.getItem('learning_os_settings') || '{"fontSize":"normal","timerEnabled":true,"instantFeedback":true,"shuffle":true}')
            },
            
            save() {
                localStorage.setItem('learning_os_bookmarks', JSON.stringify(this.state.bookmarks));
                localStorage.setItem('learning_os_favorites', JSON.stringify(this.state.favorites));
                localStorage.setItem('learning_os_progress', JSON.stringify(this.state.progress));
                localStorage.setItem('learning_os_recent', JSON.stringify(this.state.recentLessons));
                localStorage.setItem('learning_os_settings', JSON.stringify(this.state.settings));
                localStorage.setItem('learning_os_theme', this.state.theme);
            },

            addRecentLesson(subjectId, lessonId) {
                this.state.recentLessons = this.state.recentLessons.filter(r => !(r.subjectId === subjectId && r.lessonId === lessonId));
                this.state.recentLessons.unshift({ subjectId, lessonId, timestamp: Date.now() });
                if (this.state.recentLessons.length > 10) this.state.recentLessons.pop();
                this.save();
            }
        };

        // Toast notification system
        function showToast(message, type = 'success') {
            let container = document.getElementById('toast-container');
            if (!container) {
                container = document.createElement('div');
                container.id = 'toast-container';
                container.className = 'fixed bottom-5 right-5 z-50 flex flex-col gap-2 pointer-events-none';
                document.body.appendChild(container);
            }
            const toast = document.createElement('div');
            const bgColors = {
                success: 'bg-emerald-600 text-white',
                error: 'bg-rose-600 text-white',
                info: 'bg-slate-800 text-white dark:bg-slate-700'
            };
            toast.className = `${bgColors[type] || bgColors.success} px-4 py-3 rounded-xl shadow-lg pointer-events-auto flex items-center gap-3 animate-fade-in text-sm font-medium`;
            toast.innerHTML = `<span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transform = 'translateY(10px)';
                toast.style.transition = 'all 0.3s ease';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        // Theme controller
        function applyTheme() {
            const theme = Store.state.theme;
            const isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
            if (isDark) {
                document.documentElement.classList.add('dark');
            } else {
                document.documentElement.classList.remove('dark');
            }
        }

        // Validation & Startup
        window.addEventListener('DOMContentLoaded', () => {
            applyTheme();
            
            // Validate window.reviewerData
            if (!window.reviewerData || !Array.isArray(window.reviewerData.subjects)) {
                renderErrorScreen();
                return;
            }

            initializeApp();
        });

        function renderErrorScreen() {
            const root = document.getElementById('app-root');
            root.innerHTML = `
                <div class="min-h-screen flex items-center justify-center p-6 bg-slate-50 dark:bg-slate-950">
                    <div class="max-w-md w-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl p-8 shadow-xl text-center">
                        <div class="w-16 h-16 bg-rose-100 dark:bg-rose-950/50 text-rose-600 rounded-2xl flex items-center justify-center mx-auto mb-6 text-2xl font-bold">⚠️</div>
                        <h1 class="text-xl font-bold text-slate-900 dark:text-white mb-2">Reviewer Data Missing or Invalid</h1>
                        <p class="text-sm text-slate-600 dark:text-slate-400 mb-6 leading-relaxed">
                            The Learning OS engine could not find valid educational data in <code class="bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded text-xs">reviewerData.js</code> or <code class="bg-slate-100 dark:bg-slate-800 px-1.5 py-0.5 rounded text-xs">window.reviewerData.subjects</code> is not an array.
                        </p>
                        <div class="space-y-2 text-left bg-slate-50 dark:bg-slate-800/50 p-4 rounded-xl text-xs text-slate-600 dark:text-slate-300 mb-6">
                            <p class="font-semibold text-slate-700 dark:text-slate-200">Troubleshooting Steps:</p>
                            <ul class="list-disc pl-4 space-y-1">
                                <li>Ensure <code class="font-mono">reviewerData.js</code> is loaded before <code class="font-mono">index.html</code>.</li>
                                <li>Verify <code class="font-mono">window.reviewerData</code> is correctly structured.</li>
                                <li>Check browser console for syntax errors.</li>
                            </ul>
                        </div>
                        <button onclick="location.reload()" class="w-full py-3 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl shadow-lg shadow-brand-600/20 transition-all">
                            Reload Application
                        </button>
                    </div>
                </div>
            `;
        }

        // Initialize Application Shell & Router
        function initializeApp() {
            renderShell();
            router();
            setupKeyboardShortcuts();
        }

        // Core Shell Layout (Sidebar / Bottom Nav + Main Content Area)
        function renderShell() {
            const root = document.getElementById('app-root');
            root.innerHTML = `
                <div class="flex h-full w-full overflow-hidden">
                    <!-- Desktop Sidebar -->
                    <aside id="sidebar" class="hidden md:flex flex-col w-64 bg-white dark:bg-slate-900 border-r border-slate-200 dark:border-slate-800 z-20 shrink-0 transition-all">
                        <div class="p-6 flex items-center justify-between border-b border-slate-100 dark:border-slate-800/60">
                            <div class="flex items-center gap-3">
                                <div class="w-9 h-9 bg-brand-600 rounded-xl flex items-center justify-center text-white font-bold shadow-md shadow-brand-600/20">OS</div>
                                <div>
                                    <h1 class="font-bold text-slate-900 dark:text-white text-base leading-tight">Learning OS</h1>
                                    <p class="text-xs text-slate-500 dark:text-slate-400">Personal Study Hub</p>
                                </div>
                            </div>
                        </div>

                        <!-- Search Bar trigger -->
                        <div class="px-4 py-3 border-b border-slate-100 dark:border-slate-800/60">
                            <button onclick="openSearchModal()" class="w-full flex items-center justify-between px-3 py-2 bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 rounded-xl text-xs hover:bg-slate-200 dark:hover:bg-slate-700 transition-colors">
                                <span class="flex items-center gap-2">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                    Quick Search...
                                </span>
                                <kbd class="bg-white dark:bg-slate-900 px-1.5 py-0.5 rounded text-[10px] border border-slate-200 dark:border-slate-700">Ctrl+K</kbd>
                            </button>
                        </div>

                        <nav class="flex-1 overflow-y-auto px-4 py-4 space-y-1">
                            ${renderNavItems()}
                        </nav>

                        <div class="p-4 border-t border-slate-100 dark:border-slate-800/60 flex items-center justify-between">
                            <span class="text-xs text-slate-500">Theme</span>
                            <button onclick="toggleTheme()" class="p-2 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 transition-colors text-xs flex items-center gap-2">
                                <span id="theme-icon">🌓</span>
                                <span class="capitalize">${Store.state.theme}</span>
                            </button>
                        </div>
                    </aside>

                    <!-- Main Content Area -->
                    <main class="flex-1 flex flex-col min-w-0 overflow-hidden relative">
                        <!-- Mobile Header -->
                        <header class="md:hidden flex items-center justify-between px-4 py-3 bg-white dark:bg-slate-900 border-b border-slate-200 dark:border-slate-800 z-10">
                            <div class="flex items-center gap-2">
                                <div class="w-7 h-7 bg-brand-600 rounded-lg flex items-center justify-center text-white font-bold text-xs">OS</div>
                                <span class="font-bold text-slate-900 dark:text-white text-sm">Learning OS</span>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="openSearchModal()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                                </button>
                                <button onclick="toggleTheme()" class="p-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300">🌓</button>
                            </div>
                        </header>

                        <!-- Dynamic View Container -->
                        <div id="main-content" class="flex-1 overflow-y-auto">
                            <!-- Rendered Views -->
                        </div>

                        <!-- Mobile Bottom Navigation -->
                        <nav class="md:hidden flex items-center justify-around bg-white dark:bg-slate-900 border-t border-slate-200 dark:border-slate-800 py-2 px-1 z-10 shrink-0">
                            ${renderMobileNavItems()}
                        </nav>
                    </main>
                </div>

                <!-- Global Search Modal Container -->
                <div id="search-modal-container"></div>
            `;
        }

        function renderNavItems() {
            const items = [
                { id: 'home', label: 'Home Dashboard', icon: '🏠' },
                { id: 'subjects', label: 'All Subjects', icon: '📚' },
                { id: 'bookmarks', label: 'Bookmarks', icon: '🔖' },
                { id: 'favorites', label: 'Favorites', icon: '⭐' },
                { id: 'stats', label: 'Statistics & Progress', icon: '📊' },
                { id: 'settings', label: 'Settings', icon: '⚙️' }
            ];
            return items.map(item => {
                const active = Store.state.currentView === item.id;
                return `
                    <button onclick="navigate('${item.id}')" class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl font-medium text-sm transition-all ${active ? 'bg-brand-50 dark:bg-brand-950/40 text-brand-600 dark:text-brand-400 font-semibold' : 'text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800/60 hover:text-slate-900 dark:hover:text-white'}">
                        <span class="text-base">${item.icon}</span>
                        <span>${item.label}</span>
                    </button>
                `;
            }).join('');
        }

        function renderMobileNavItems() {
            const items = [
                { id: 'home', label: 'Home', icon: '🏠' },
                { id: 'subjects', label: 'Subjects', icon: '📚' },
                { id: 'bookmarks', label: 'Saved', icon: '🔖' },
                { id: 'stats', label: 'Stats', icon: '📊' },
                { id: 'settings', label: 'Settings', icon: '⚙️' }
            ];
            return items.map(item => {
                const active = Store.state.currentView === item.id;
                return `
                    <button onclick="navigate('${item.id}')" class="flex flex-col items-center gap-1 py-1 px-3 rounded-lg text-xs font-medium ${active ? 'text-brand-600 dark:text-brand-400' : 'text-slate-500 dark:text-slate-400'}">
                        <span class="text-lg">${item.icon}</span>
                        <span>${item.label}</span>
                    </button>
                `;
            }).join('');
        }

        // Router & Navigation Handler
        function navigate(view, params = {}) {
            Store.state.currentView = view;
            if (params.subjectId !== undefined) Store.state.currentSubjectId = params.subjectId;
            if (params.lessonId !== undefined) Store.state.currentLessonId = params.lessonId;
            
            // Re-render sidebar active state on desktop
            const sidebarNav = document.querySelector('aside nav');
            if (sidebarNav) sidebarNav.innerHTML = renderNavItems();
            const mobileNav = document.querySelector('nav.md\\:hidden:last-of-type');
            if (mobileNav) mobileNav.innerHTML = renderMobileNavItems();

            renderCurrentView();
        }

        function renderCurrentView() {
            const container = document.getElementById('main-content');
            container.scrollTop = 0;
            
            switch(Store.state.currentView) {
                case 'home':
                    container.innerHTML = renderHomeView();
                    break;
                case 'subjects':
                    container.innerHTML = renderSubjectsView();
                    break;
                case 'lessons':
                    container.innerHTML = renderLessonsView(Store.state.currentSubjectId);
                    break;
                case 'lesson-detail':
                    container.innerHTML = renderLessonDetailView(Store.state.currentSubjectId, Store.state.currentLessonId);
                    break;
                case 'practice':
                    container.innerHTML = renderPracticeView(Store.state.currentSubjectId, Store.state.currentLessonId);
                    break;
                case 'flashcards':
                    container.innerHTML = renderFlashcardsView(Store.state.currentSubjectId, Store.state.currentLessonId);
                    break;
                case 'bookmarks':
                    container.innerHTML = renderBookmarksView();
                    break;
                case 'favorites':
                    container.innerHTML = renderFavoritesView();
                    break;
                case 'stats':
                    container.innerHTML = renderStatsView();
                    break;
                case 'settings':
                    container.innerHTML = renderSettingsView();
                    break;
                default:
                    container.innerHTML = renderHomeView();
            }
        }

        function renderHomeView() {
            const subjects = window.reviewerData.subjects || [];
            let totalLessons = 0;
            let totalQuestions = 0;
            let totalFlashcards = 0;

            subjects.forEach(sub => {
                if (sub.lessons) {
                    totalLessons += sub.lessons.length;
                    sub.lessons.forEach(l => {
                        if (l.questions) totalQuestions += l.questions.length;
                        if (l.flashcards) totalFlashcards += l.flashcards.length;
                    });
                }
            });

            const completedCount = Store.state.progress.completedLessons.length;
            const completionRate = totalLessons > 0 ? Math.round((completedCount / totalLessons) * 100) : 0;

            // Find last studied recent lesson
            let lastLessonHtml = '';
            if (Store.state.recentLessons.length > 0) {
                const recent = Store.state.recentLessons[0];
                const sub = subjects.find(s => s.id === recent.subjectId || s.name === recent.subjectId);
                if (sub && sub.lessons) {
                    const les = sub.lessons.find(l => l.id === recent.lessonId || l.title === recent.lessonId);
                    if (les) {
                        lastLessonHtml = `
                            <div class="bg-brand-50 dark:bg-brand-950/30 border border-brand-200 dark:border-brand-900/50 rounded-2xl p-6 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
                                <div class="space-y-1">
                                    <span class="text-xs font-semibold uppercase tracking-wider text-brand-600 dark:text-brand-400">Continue Studying</span>
                                    <h3 class="text-lg font-bold text-slate-900 dark:text-white">${les.title}</h3>
                                    <p class="text-sm text-slate-600 dark:text-slate-400">Subject: ${sub.name}</p>
                                </div>
                                <button onclick="navigate('lesson-detail', { subjectId: '${sub.id || sub.name}', lessonId: '${les.id || les.title}' })" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl shadow-md shadow-brand-600/20 transition-all text-sm shrink-0">
                                    Resume Lesson →
                                </button>
                            </div>
                        `;
                    }
                }
            }

            return `
                <div class="max-w-5xl mx-auto p-6 space-y-8 animate-fade-in">
                    <!-- Welcome Banner -->
                    <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-sm">
                        <div class="space-y-2">
                            <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 text-xs font-semibold">
                                ⚡ Learning OS Active Engine
                            </span>
                            <h1 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white">Welcome back to your study hub</h1>
                            <p class="text-slate-600 dark:text-slate-400 text-sm max-w-xl">
                                Access your reviewer materials seamlessly. All data is loaded securely and organized for optimal retention.
                            </p>
                        </div>
                        <div class="flex items-center gap-3 shrink-0">
                            <button onclick="navigate('subjects')" class="px-5 py-3 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-2xl shadow-lg shadow-brand-600/25 transition-all text-sm">
                                Browse Subjects
                            </button>
                        </div>
                    </div>

                    ${lastLessonHtml}

                    <!-- Statistics Grid -->
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-sm">
                            <div class="text-slate-500 dark:text-slate-400 text-xs font-medium mb-1">Subjects Available</div>
                            <div class="text-2xl font-bold text-slate-900 dark:text-white">${subjects.length}</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-sm">
                            <div class="text-slate-500 dark:text-slate-400 text-xs font-medium mb-1">Total Lessons</div>
                            <div class="text-2xl font-bold text-slate-900 dark:text-white">${totalLessons}</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-sm">
                            <div class="text-slate-500 dark:text-slate-400 text-xs font-medium mb-1">Practice Questions</div>
                            <div class="text-2xl font-bold text-slate-900 dark:text-white">${totalQuestions}</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-sm">
                            <div class="text-slate-500 dark:text-slate-400 text-xs font-medium mb-1">Completion Rate</div>
                            <div class="text-2xl font-bold text-brand-600 dark:text-brand-400">${completionRate}%</div>
                        </div>
                    </div>

                    <!-- Quick Subjects Preview -->
                    <div class="space-y-4">
                        <div class="flex items-center justify-between">
                            <h2 class="text-lg font-bold text-slate-900 dark:text-white">Featured Subjects</h2>
                            <button onclick="navigate('subjects')" class="text-xs font-semibold text-brand-600 dark:text-brand-400 hover:underline">View All →</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                            ${subjects.slice(0, 3).map(sub => {
                                const subId = sub.id || sub.name;
                                const lCount = sub.lessons ? sub.lessons.length : 0;
                                const isFav = Store.state.favorites.subjects.includes(subId);
                                return `
                                    <div onclick="navigate('lessons', { subjectId: '${subId}' })" class="group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-sm hover:border-brand-500 dark:hover:border-brand-500 transition-all cursor-pointer flex flex-col justify-between">
                                        <div>
                                            <div class="flex items-center justify-between mb-3">
                                                <span class="px-2.5 py-1 rounded-lg bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 text-xs font-medium">${lCount} Lessons</span>
                                                <button onclick="event.stopPropagation(); toggleFavorite('subjects', '${subId}')" class="text-slate-400 hover:text-amber-500 transition-colors">
                                                    ${isFav ? '⭐' : '☆'}
                                                </button>
                                            </div>
                                            <h3 class="font-bold text-slate-900 dark:text-white group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors text-base mb-1">${sub.name}</h3>
                                            <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-2">${sub.description || 'Explore comprehensive lessons and practice questions.'}</p>
                                        </div>
                                        <div class="mt-4 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs font-medium text-brand-600 dark:text-brand-400">
                                            <span>Open Subject</span>
                                            <span>→</span>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSubjectsView() {
            const subjects = window.reviewerData.subjects || [];
            if (subjects.length === 0) {
                return renderEmptyState('No Subjects Found', 'reviewerData.js does not contain any subjects.', 'Check your reviewer data structure.');
            }

            return `
                <div class="max-w-5xl mx-auto p-6 space-y-6 animate-fade-in">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                        <div>
                            <h1 class="text-2xl font-bold text-slate-900 dark:text-white">All Subjects</h1>
                            <p class="text-sm text-slate-500 dark:text-slate-400">Select a subject to access lessons, flashcards, and quizzes.</p>
                        </div>
                        <div class="w-full sm:w-72">
                            <input type="text" id="subject-search" placeholder="Filter subjects..." oninput="filterSubjects(this.value)" class="w-full px-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                        </div>
                    </div>

                    <div id="subjects-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                        ${subjects.map(sub => {
                            const subId = sub.id || sub.name;
                            const lessons = sub.lessons || [];
                            let qCount = 0;
                            let fCount = 0;
                            lessons.forEach(l => {
                                if (l.questions) qCount += l.questions.length;
                                if (l.flashcards) fCount += l.flashcards.length;
                            });
                            const isFav = Store.state.favorites.subjects.includes(subId);

                            return `
                                <div onclick="navigate('lessons', { subjectId: '${subId}' })" class="subject-card group bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-sm hover:border-brand-500 dark:hover:border-brand-500 transition-all cursor-pointer flex flex-col justify-between" data-name="${sub.name.toLowerCase()}">
                                    <div>
                                        <div class="flex items-center justify-between mb-4">
                                            <span class="px-3 py-1 rounded-xl bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 text-xs font-semibold">${lessons.length} Lessons</span>
                                            <button onclick="event.stopPropagation(); toggleFavorite('subjects', '${subId}'); renderCurrentView();" class="text-lg text-slate-400 hover:text-amber-500 transition-colors">
                                                ${isFav ? '⭐' : '☆'}
                                            </button>
                                        </div>
                                        <h2 class="text-lg font-bold text-slate-900 dark:text-white group-hover:text-brand-600 dark:group-hover:text-brand-400 transition-colors mb-2">${sub.name}</h2>
                                        <p class="text-xs text-slate-600 dark:text-slate-400 line-clamp-3 leading-relaxed">${sub.description || 'Comprehensive subject reviewer material.'}</p>
                                    </div>
                                    <div class="mt-6 pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between text-xs text-slate-500 dark:text-slate-400">
                                        <span>${qCount} Questions • ${fCount} Flashcards</span>
                                        <span class="font-semibold text-brand-600 dark:text-brand-400 group-hover:translate-x-1 transition-transform">Explore →</span>
                                    </div>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        function filterSubjects(query) {
            const cards = document.querySelectorAll('.subject-card');
            const q = query.toLowerCase();
            cards.forEach(card => {
                const name = card.getAttribute('data-name');
                if (name.includes(q)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function renderLessonsView(subjectId) {
            const subjects = window.reviewerData.subjects || [];
            const subject = subjects.find(s => (s.id === subjectId) || (s.name === subjectId));
            if (!subject) return renderEmptyState('Subject Not Found', 'The requested subject does not exist.', 'Return to all subjects.', "navigate('subjects')");

            const lessons = subject.lessons || [];

            return `
                <div class="max-w-5xl mx-auto p-6 space-y-6 animate-fade-in">
                    <!-- Breadcrumb & Header -->
                    <div class="space-y-2">
                        <div class="flex items-center gap-2 text-xs font-medium text-slate-500 dark:text-slate-400">
                            <button onclick="navigate('subjects')" class="hover:underline">Subjects</button>
                            <span>/</span>
                            <span class="text-slate-900 dark:text-white font-semibold">${subject.name}</span>
                        </div>
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div>
                                <h1 class="text-2xl font-bold text-slate-900 dark:text-white">${subject.name}</h1>
                                <p class="text-sm text-slate-600 dark:text-slate-400">${subject.description || ''}</p>
                            </div>
                            <div class="w-full sm:w-72">
                                <input type="text" placeholder="Filter lessons..." oninput="filterLessons(this.value)" class="w-full px-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                            </div>
                        </div>
                    </div>

                    ${lessons.length === 0 ? renderEmptyState('No Lessons Available', 'This subject currently has no lessons.', 'Check back later or choose another subject.') : `
                        <div class="space-y-3" id="lessons-list">
                            ${lessons.map((lesson, idx) => {
                                const lessonId = lesson.id || lesson.title;
                                const isCompleted = Store.state.progress.completedLessons.includes(`${subject.name}_${lessonId}`);
                                const isBookmarked = Store.state.bookmarks.lessons.includes(`${subject.name}_${lessonId}`);
                                const isFav = Store.state.favorites.lessons.includes(`${subject.name}_${lessonId}`);
                                const qCount = lesson.questions ? lesson.questions.length : 0;
                                const fCount = lesson.flashcards ? lesson.flashcards.length : 0;

                                return `
                                    <div class="lesson-card bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-sm hover:border-brand-500 dark:hover:border-brand-500 transition-all flex flex-col md:flex-row md:items-center justify-between gap-4" data-title="${lesson.title.toLowerCase()}">
                                        <div class="flex items-start gap-4">
                                            <div class="w-10 h-10 rounded-xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center font-bold text-slate-700 dark:text-slate-300 shrink-0 text-sm">
                                                ${idx + 1}
                                            </div>
                                            <div class="space-y-1">
                                                <div class="flex items-center gap-2">
                                                    <h2 class="font-bold text-slate-900 dark:text-white text-base">${lesson.title}</h2>
                                                    ${isCompleted ? '<span class="px-2 py-0.5 rounded bg-emerald-100 dark:bg-emerald-950/50 text-emerald-600 dark:text-emerald-400 text-[10px] font-semibold">Completed</span>' : ''}
                                                </div>
                                                <p class="text-xs text-slate-600 dark:text-slate-400 line-clamp-2">${lesson.description || 'Review notes, flashcards, and interactive practice questions.'}</p>
                                                <div class="flex items-center gap-4 text-xs text-slate-500 dark:text-slate-400 pt-1">
                                                    <span>📝 ${qCount} Questions</span>
                                                    <span>📇 ${fCount} Flashcards</span>
                                                </div>
                                            </div>
                                        </div>
                                        <div class="flex items-center gap-2 self-end md:self-center shrink-0">
                                            <button onclick="toggleBookmark('lessons', '${subject.name}_${lessonId}'); renderCurrentView();" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors text-sm" title="Bookmark">
                                                ${isBookmarked ? '🔖' : '📑'}
                                            </button>
                                            <button onclick="toggleFavorite('lessons', '${subject.name}_${lessonId}'); renderCurrentView();" class="p-2.5 rounded-xl bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-600 dark:text-slate-300 transition-colors text-sm" title="Favorite">
                                                ${isFav ? '⭐' : '☆'}
                                            </button>
                                            <button onclick="navigate('lesson-detail', { subjectId: '${subject.id || subject.name}', lessonId: '${lessonId}' })" class="px-4 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl shadow-sm transition-all text-xs">
                                                Study Lesson →
                                            </button>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function filterLessons(query) {
            const cards = document.querySelectorAll('.lesson-card');
            const q = query.toLowerCase();
            cards.forEach(card => {
                const title = card.getAttribute('data-title');
                if (title.includes(q)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        }

        function renderLessonDetailView(subjectId, lessonId) {
            const subjects = window.reviewerData.subjects || [];
            const subject = subjects.find(s => (s.id === subjectId) || (s.name === subjectId));
            if (!subject) return renderEmptyState('Subject Not Found', '', '', "navigate('subjects')");
            const lesson = (subject.lessons || []).find(l => (l.id === lessonId) || (l.title === lessonId));
            if (!lesson) return renderEmptyState('Lesson Not Found', '', '', `navigate('lessons', { subjectId: '${subjectId}' })`);

            Store.addRecentLesson(subject.id || subject.name, lesson.id || lesson.title);

            let contentHtml = '';
            if (typeof lesson.content === 'string') {
                // Automatically format plain text or markdown-like content into structured paragraphs
                contentHtml = lesson.content.split('\n\n').map(p => `<p class="mb-4 leading-relaxed text-slate-700 dark:text-slate-300">${p}</p>`).join('');
            } else if (Array.isArray(lesson.content)) {
                // Structured content blocks
                contentHtml = lesson.content.map(block => {
                    switch (block.type) {
                        case 'heading':
                            return `<h2 class="text-xl font-bold text-slate-900 dark:text-white mt-6 mb-3">${block.text}</h2>`;
                        case 'subheading':
                            return `<h3 class="text-lg font-semibold text-slate-800 dark:text-slate-200 mt-4 mb-2">${block.text}</h3>`;
                        case 'paragraph':
                            return `<p class="mb-4 leading-relaxed text-slate-700 dark:text-slate-300">${block.text}</p>`;
                        case 'definition':
                            return `<div class="bg-brand-50 dark:bg-brand-950/40 border-l-4 border-brand-500 p-4 rounded-r-xl my-4 text-slate-800 dark:text-slate-200"><strong class="font-semibold">${block.term || 'Definition'}:</strong> ${block.text}</div>`;
                        case 'warning':
                            return `<div class="bg-amber-50 dark:bg-amber-950/40 border-l-4 border-amber-500 p-4 rounded-r-xl my-4 text-amber-900 dark:text-amber-200"><strong class="font-semibold">⚠️ Note / Warning:</strong> ${block.text}</div>`;
                        case 'example':
                            return `<div class="bg-slate-100 dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 p-4 rounded-xl my-4 text-slate-700 dark:text-slate-300"><strong class="font-semibold text-slate-900 dark:text-white">Example:</strong> ${block.text}</div>`;
                        case 'quote':
                            return `<blockquote class="border-l-2 border-slate-400 pl-4 italic my-4 text-slate-600 dark:text-slate-400">"${block.text}"</blockquote>`;
                        case 'list':
                            return `<ul class="list-disc pl-6 space-y-1 my-4 text-slate-700 dark:text-slate-300">${(block.items || []).map(i => `<li>${i}</li>`).join('')}</ul>`;
                        case 'code':
                            return `<pre class="bg-slate-900 text-slate-100 p-4 rounded-xl overflow-x-auto font-mono text-xs my-4"><code>${escapeHtml(block.text)}</code></pre>`;
                        default:
                            return `<p class="mb-4 leading-relaxed text-slate-700 dark:text-slate-300">${block.text || ''}</p>`;
                    }
                }).join('');
            } else {
                contentHtml = `<p class="text-slate-500">No review content provided for this lesson.</p>`;
            }

            const hasFlashcards = lesson.flashcards && lesson.flashcards.length > 0;
            const hasQuestions = lesson.questions && lesson.questions.length > 0;
            const key = `${subject.name}_${lessonId}`;
            const isCompleted = Store.state.progress.completedLessons.includes(key);

            return `
                <div class="max-w-4xl mx-auto p-6 space-y-8 animate-fade-in">
                    <!-- Navigation / Header -->
                    <div class="flex items-center justify-between">
                        <button onclick="navigate('lessons', { subjectId: '${subject.id || subject.name}' })" class="inline-flex items-center gap-2 text-xs font-semibold text-slate-500 dark:text-slate-400 hover:text-slate-900 dark:hover:text-white">
                            ← Back to Lessons
                        </button>
                        <div class="flex items-center gap-2">
                            <button onclick="markLessonComplete('${key}')" class="px-4 py-2 rounded-xl text-xs font-semibold ${isCompleted ? 'bg-emerald-100 dark:bg-emerald-950 text-emerald-700 dark:text-emerald-300' : 'bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300'}">
                                ${isCompleted ? '✓ Completed' : 'Mark Complete'}
                            </button>
                        </div>
                    </div>

                    <!-- Lesson Title Banner -->
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-sm space-y-4">
                        <span class="px-3 py-1 rounded-full bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 text-xs font-semibold">${subject.name}</span>
                        <h1 class="text-2xl md:text-3xl font-bold text-slate-900 dark:text-white">${lesson.title}</h1>
                        <p class="text-sm text-slate-600 dark:text-slate-400">${lesson.description || ''}</p>
                        
                        <div class="flex flex-wrap items-center gap-3 pt-4 border-t border-slate-100 dark:border-slate-800">
                            ${hasFlashcards ? `<button onclick="navigate('flashcards', { subjectId: '${subject.id || subject.name}', lessonId: '${lessonId}' })" class="px-4 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 font-medium rounded-xl text-xs flex items-center gap-2 transition-all"><span>📇 Study Flashcards (${lesson.flashcards.length})</span></button>` : ''}
                            ${hasQuestions ? `<button onclick="navigate('practice', { subjectId: '${subject.id || subject.name}', lessonId: '${lessonId}' })" class="px-4 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl text-xs flex items-center gap-2 shadow-md shadow-brand-600/20 transition-all"><span>📝 Start Practice Quiz (${lesson.questions.length})</span></button>` : ''}
                        </div>
                    </div>

                    <!-- Lesson Content Body -->
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-sm prose dark:prose-invert max-w-none">
                        ${contentHtml}
                    </div>

                    <!-- Footer Action -->
                    <div class="flex items-center justify-between pt-4">
                        <button onclick="navigate('lessons', { subjectId: '${subject.id || subject.name}' })" class="px-5 py-2.5 bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 text-slate-700 dark:text-slate-300 font-medium rounded-xl text-xs">
                            ← Back to Lessons
                        </button>
                        ${hasQuestions ? `<button onclick="navigate('practice', { subjectId: '${subject.id || subject.name}', lessonId: '${lessonId}' })" class="px-5 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl text-xs shadow-md">
                            Take Practice Quiz →
                        </button>` : ''}
                    </div>
                </div>
            `;
        }

        function markLessonComplete(key) {
            if (!Store.state.progress.completedLessons.includes(key)) {
                Store.state.progress.completedLessons.push(key);
                Store.save();
                showToast('Lesson marked as completed!', 'success');
                renderCurrentView();
            } else {
                Store.state.progress.completedLessons = Store.state.progress.completedLessons.filter(k => k !== key);
                Store.save();
                showToast('Lesson marked as incomplete.', 'info');
                renderCurrentView();
            }
        }

        function escapeHtml(text) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function renderFlashcardsView(subjectId, lessonId) {
            const subjects = window.reviewerData.subjects || [];
            const subject = subjects.find(s => (s.id === subjectId) || (s.name === subjectId));
            if (!subject) return renderEmptyState('Subject Not Found', '', '', "navigate('subjects')");
            const lesson = (subject.lessons || []).find(l => (l.id === lessonId) || (l.title === lessonId));
            if (!lesson || !lesson.flashcards || lesson.flashcards.length === 0) {
                return renderEmptyState('No Flashcards Available', 'This lesson has no flashcards.', 'Return to lesson details.', `navigate('lesson-detail', { subjectId: '${subjectId}', lessonId: '${lessonId}' })`);
            }

            const flashcards = lesson.flashcards;
            window._flashcardIndex = window._flashcardIndex || 0;
            if (window._flashcardIndex >= flashcards.length) window._flashcardIndex = 0;
            const card = flashcards[window._flashcardIndex];

            return `
                <div class="max-w-2xl mx-auto p-6 space-y-6 flex flex-col justify-center min-h-[80vh] animate-fade-in">
                    <div class="flex items-center justify-between">
                        <button onclick="navigate('lesson-detail', { subjectId: '${subjectId}', lessonId: '${lessonId}' })" class="text-xs font-semibold text-slate-500 dark:text-slate-400 hover:underline">
                            ← Exit Flashcards
                        </button>
                        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">Card ${window._flashcardIndex + 1} of ${flashcards.length}</span>
                    </div>

                    <!-- Flashcard Card -->
                    <div class="flashcard-container w-full h-80 cursor-pointer" onclick="toggleFlashcardFlip()">
                        <div id="flashcard-inner" class="flashcard-inner relative w-full h-full rounded-3xl shadow-lg">
                            <!-- Front -->
                            <div class="flashcard-face absolute inset-0 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl flex flex-col justify-between select-none">
                                <span class="text-xs font-semibold uppercase tracking-wider text-brand-600 dark:text-brand-400">Question / Term</span>
                                <div class="text-center font-bold text-xl md:text-2xl text-slate-900 dark:text-white my-auto">
                                    ${card.front || card.question || card.term}
                                </div>
                                <span class="text-xs text-center text-slate-400">Click or tap to flip</span>
                            </div>
                            <!-- Back -->
                            <div class="flashcard-face flashcard-back absolute inset-0 bg-brand-600 text-white p-8 rounded-3xl flex flex-col justify-between select-none">
                                <span class="text-xs font-semibold uppercase tracking-wider text-brand-200">Answer / Definition</span>
                                <div class="text-center font-medium text-lg md:text-xl my-auto leading-relaxed">
                                    ${card.back || card.answer || card.definition}
                                </div>
                                <span class="text-xs text-center text-brand-200">Click or tap to flip back</span>
                            </div>
                        </div>
                    </div>

                    <!-- Controls -->
                    <div class="flex items-center justify-between gap-4">
                        <button onclick="prevFlashcard(${flashcards.length})" class="flex-1 py-3 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:bg-slate-50 dark:hover:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium rounded-xl text-sm transition-all">
                            ← Previous
                        </button>
                        <button onclick="nextFlashcard(${flashcards.length})" class="flex-1 py-3 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl text-sm shadow-md transition-all">
                            Next Card →
                        </button>
                    </div>
                </div>
            `;
        }

        function toggleFlashcardFlip() {
            const inner = document.getElementById('flashcard-inner');
            if (inner) inner.classList.toggle('flashcard-flipped');
        }

        function nextFlashcard(total) {
            window._flashcardIndex = (window._flashcardIndex + 1) % total;
            renderCurrentView();
        }

        function prevFlashcard(total) {
            window._flashcardIndex = (window._flashcardIndex - 1 + total) % total;
            renderCurrentView();
        }

        function renderPracticeView(subjectId, lessonId) {
            const subjects = window.reviewerData.subjects || [];
            const subject = subjects.find(s => (s.id === subjectId) || (s.name === subjectId));
            if (!subject) return renderEmptyState('Subject Not Found', '', '', "navigate('subjects')");
            const lesson = (subject.lessons || []).find(l => (l.id === lessonId) || (l.title === lessonId));
            if (!lesson || !lesson.questions || lesson.questions.length === 0) {
                return renderEmptyState('No Practice Questions', 'This lesson has no practice questions available.', 'Return to lesson details.', `navigate('lesson-detail', { subjectId: '${subjectId}', lessonId: '${lessonId}' })`);
            }

            window._quizState = window._quizState || {
                currentIndex: 0,
                score: 0,
                answers: {},
                submitted: false,
                finished: false
            };

            const questions = lesson.questions;
            const state = window._quizState;

            if (state.finished) {
                return renderQuizResultsView(subjectId, lessonId, questions);
            }

            const q = questions[state.currentIndex];
            const qType = q.type || 'multiple_choice';

            return `
                <div class="max-w-3xl mx-auto p-6 space-y-6 animate-fade-in">
                    <!-- Header progress -->
                    <div class="flex items-center justify-between">
                        <button onclick="exitQuiz()" class="text-xs font-semibold text-slate-500 dark:text-slate-400 hover:underline">
                            ← Exit Quiz
                        </button>
                        <span class="text-xs font-semibold text-slate-500 dark:text-slate-400">Question ${state.currentIndex + 1} of ${questions.length}</span>
                    </div>

                    <!-- Progress bar -->
                    <div class="w-full bg-slate-200 dark:bg-slate-800 h-2 rounded-full overflow-hidden">
                        <div class="bg-brand-600 h-full transition-all duration-300" style="width: ${((state.currentIndex + 1) / questions.length) * 100}%"></div>
                    </div>

                    <!-- Question Card -->
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-sm space-y-6">
                        <div class="space-y-2">
                            <span class="px-2.5 py-1 rounded-lg bg-brand-50 dark:bg-brand-950/50 text-brand-600 dark:text-brand-400 text-xs font-semibold uppercase">${qType.replace('_', ' ')}</span>
                            <h2 class="text-lg md:text-xl font-bold text-slate-900 dark:text-white leading-relaxed">${q.question || q.prompt}</h2>
                        </div>

                        <!-- Answer Input Area based on type -->
                        <div class="space-y-3" id="answer-area">
                            ${renderQuestionInput(q, state)}
                        </div>

                        ${state.submitted && q.explanation ? `
                            <div class="bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 p-4 rounded-2xl text-xs space-y-1">
                                <span class="font-bold text-slate-900 dark:text-white">Explanation:</span>
                                <p class="text-slate-600 dark:text-slate-300 leading-relaxed">${q.explanation}</p>
                            </div>
                        ` : ''}
                    </div>

                    <!-- Actions -->
                    <div class="flex items-center justify-between">
                        ${state.currentIndex > 0 ? `<button onclick="prevQuizQuestion()" class="px-5 py-2.5 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium rounded-xl text-xs">Previous</button>` : '<div></div>'}
                        
                        ${!state.submitted ? `
                            <button onclick="submitQuizAnswer('${qType}')" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl text-xs shadow-md">
                                Submit Answer
                            </button>
                        ` : `
                            <button onclick="nextQuizQuestion(${questions.length})" class="px-6 py-2.5 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl text-xs shadow-md">
                                ${state.currentIndex + 1 === questions.length ? 'Finish Quiz →' : 'Next Question →'}
                            </button>
                        `}
                    </div>
                </div>
            `;
        }

        function renderQuestionInput(q, state) {
            const qType = q.type || 'multiple_choice';
            const currentAnswer = state.answers[state.currentIndex];

            if (qType === 'multiple_choice' || qType === 'true_false') {
                const choices = q.choices || (qType === 'true_false' ? ['True', 'False'] : []);
                return choices.map((choice, i) => {
                    const isSelected = currentAnswer === choice;
                    let style = 'bg-slate-50 dark:bg-slate-800/60 border-slate-200 dark:border-slate-700 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800';
                    if (state.submitted) {
                        if (choice === q.answer || choice === q.correctAnswer) {
                            style = 'bg-emerald-50 dark:bg-emerald-950/50 border-emerald-500 text-emerald-800 dark:text-emerald-200 font-semibold';
                        } else if (isSelected) {
                            style = 'bg-rose-50 dark:bg-rose-950/50 border-rose-500 text-rose-800 dark:text-rose-200';
                        }
                    } else if (isSelected) {
                        style = 'bg-brand-50 dark:bg-brand-950/50 border-brand-500 text-brand-800 dark:text-brand-200 font-semibold';
                    }

                    return `
                        <div onclick="selectQuizChoice('${choice}')" class="w-full p-4 border rounded-2xl cursor-pointer transition-all flex items-center justify-between ${style}">
                            <span>${choice}</span>
                            <span class="w-5 h-5 rounded-full border border-slate-300 flex items-center justify-center text-xs ${isSelected ? 'border-brand-500 bg-brand-500 text-white' : ''}">${isSelected ? '✓' : ''}</span>
                        </div>
                    `;
                }).join('');
            } else {
                // Short answer / identification
                return `
                    <input type="text" id="short-answer-input" placeholder="Type your answer here..." value="${currentAnswer || ''}" ${state.submitted ? 'disabled' : ''} oninput="Store.state._tempAnswer = this.value" class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:border-brand-500">
                    ${state.submitted ? `<p class="text-xs text-slate-500 font-medium">Correct Answer: <span class="text-emerald-600 font-bold">${q.answer || q.correctAnswer}</span></p>` : ''}
                `;
            }
        }

        function selectQuizChoice(choice) {
            if (window._quizState.submitted) return;
            window._quizState.answers[window._quizState.currentIndex] = choice;
            renderCurrentView();
        }

        function submitQuizAnswer(qType) {
            if (qType !== 'multiple_choice' && qType !== 'true_false') {
                const input = document.getElementById('short-answer-input');
                if (input) window._quizState.answers[window._quizState.currentIndex] = input.value.trim();
            }
            window._quizState.submitted = true;
            renderCurrentView();
        }

        function nextQuizQuestion(total) {
            if (window._quizState.currentIndex + 1 < total) {
                window._quizState.currentIndex++;
                window._quizState.submitted = false;
                renderCurrentView();
            } else {
                window._quizState.finished = true;
                renderCurrentView();
            }
        }

        function prevQuizQuestion() {
            if (window._quizState.currentIndex > 0) {
                window._quizState.currentIndex--;
                window._quizState.submitted = !!window._quizState.answers[window._quizState.currentIndex];
                renderCurrentView();
            }
        }

        function exitQuiz() {
            window._quizState = null;
            history.back();
        }

        function renderQuizResultsView(subjectId, lessonId, questions) {
            let correctCount = 0;
            questions.forEach((q, idx) => {
                const userAns = window._quizState.answers[idx];
                const correctAns = q.answer || q.correctAnswer;
                if (userAns && correctAns && userAns.toString().trim().toLowerCase() === correctAns.toString().trim().toLowerCase()) {
                    correctCount++;
                }
            });

            const percentage = Math.round((correctCount / questions.length) * 100);

            return `
                <div class="max-w-xl mx-auto p-6 space-y-6 text-center animate-fade-in py-12">
                    <div class="w-20 h-20 bg-brand-100 dark:bg-brand-950/50 text-brand-600 rounded-3xl flex items-center justify-center mx-auto text-3xl font-bold">🏆</div>
                    <div class="space-y-2">
                        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Quiz Completed!</h1>
                        <p class="text-sm text-slate-600 dark:text-slate-400">Here is a summary of your performance.</p>
                    </div>

                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-8 rounded-3xl shadow-sm space-y-4">
                        <div class="text-4xl font-extrabold text-brand-600 dark:text-brand-400">${percentage}%</div>
                        <p class="text-sm text-slate-600 dark:text-slate-400">You got <strong class="text-slate-900 dark:text-white">${correctCount}</strong> out of <strong class="text-slate-900 dark:text-white">${questions.length}</strong> questions correct.</p>
                    </div>

                    <div class="flex items-center justify-center gap-4 pt-4">
                        <button onclick="window._quizState = null; renderCurrentView();" class="px-6 py-3 bg-slate-100 dark:bg-slate-800 text-slate-700 dark:text-slate-300 font-medium rounded-xl text-xs">
                            Retry Quiz
                        </button>
                        <button onclick="window._quizState = null; navigate('lesson-detail', { subjectId: '${subjectId}', lessonId: '${lessonId}' });" class="px-6 py-3 bg-brand-600 hover:bg-brand-500 text-white font-medium rounded-xl text-xs shadow-md">
                            Back to Lesson →
                        </button>
                    </div>
                </div>
            `;
        }

        function renderBookmarksView() {
            const bookmarks = Store.state.bookmarks.lessons || [];
            return `
                <div class="max-w-4xl mx-auto p-6 space-y-6 animate-fade-in">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Bookmarked Lessons</h1>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Quickly access your saved study materials.</p>
                    </div>

                    ${bookmarks.length === 0 ? renderEmptyState('No Bookmarks Yet', 'Bookmark lessons while browsing to access them easily here.', 'Browse Subjects', "navigate('subjects')") : `
                        <div class="space-y-3">
                            ${bookmarks.map(bKey => {
                                const parts = bKey.split('_');
                                const subName = parts[0];
                                const lesTitle = parts.slice(1).join('_');
                                return `
                                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-5 rounded-2xl shadow-sm flex items-center justify-between">
                                        <div>
                                            <span class="text-xs font-semibold text-brand-600 dark:text-brand-400">${subName}</span>
                                            <h3 class="font-bold text-slate-900 dark:text-white text-base">${lesTitle}</h3>
                                        </div>
                                        <button onclick="navigate('lesson-detail', { subjectId: '${subName}', lessonId: '${lesTitle}' })" class="px-4 py-2 bg-brand-600 text-white font-medium rounded-xl text-xs">
                                            Open →
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function renderFavoritesView() {
            const favSubjects = Store.state.favorites.subjects || [];
            return `
                <div class="max-w-4xl mx-auto p-6 space-y-6 animate-fade-in">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Favorite Subjects</h1>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Your starred subjects for fast access.</p>
                    </div>

                    ${favSubjects.length === 0 ? renderEmptyState('No Favorites Yet', 'Star your favorite subjects to pin them here.', 'Explore Subjects', "navigate('subjects')") : `
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            ${favSubjects.map(subId => {
                                const sub = (window.reviewerData.subjects || []).find(s => (s.id === subId) || (s.name === subId));
                                if (!sub) return '';
                                return `
                                    <div onclick="navigate('lessons', { subjectId: '${sub.id || sub.name}' })" class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-sm cursor-pointer hover:border-brand-500 transition-all">
                                        <h3 class="font-bold text-slate-900 dark:text-white text-base mb-1">${sub.name}</h3>
                                        <p class="text-xs text-slate-500 line-clamp-2">${sub.description || ''}</p>
                                    </div>
                                `
                            }).join('')}
                        </div>
                    `}
                </div>
            `;
        }

        function renderStatsView() {
            const completedCount = Store.state.progress.completedLessons.length;
            return `
                <div class="max-w-4xl mx-auto p-6 space-y-6 animate-fade-in">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Statistics & Progress</h1>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Track your learning journey and mastery metrics.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-sm">
                            <div class="text-slate-500 text-xs font-medium mb-1">Completed Lessons</div>
                            <div class="text-3xl font-bold text-brand-600 dark:text-brand-400">${completedCount}</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-sm">
                            <div class="text-slate-500 text-xs font-medium mb-1">Bookmarked Items</div>
                            <div class="text-3xl font-bold text-slate-900 dark:text-white">${Store.state.bookmarks.lessons.length}</div>
                        </div>
                        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-2xl shadow-sm">
                            <div class="text-slate-500 text-xs font-medium mb-1">Favorite Subjects</div>
                            <div class="text-3xl font-bold text-slate-900 dark:text-white">${Store.state.favorites.subjects.length}</div>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderSettingsView() {
            return `
                <div class="max-w-2xl mx-auto p-6 space-y-6 animate-fade-in">
                    <div>
                        <h1 class="text-2xl font-bold text-slate-900 dark:text-white">Settings</h1>
                        <p class="text-sm text-slate-500 dark:text-slate-400">Customize your Learning OS preferences.</p>
                    </div>

                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 p-6 rounded-3xl shadow-sm space-y-6">
                        <div class="flex items-center justify-between">
                            <div>
                                <h3 class="font-bold text-slate-900 dark:text-white text-sm">Theme Appearance</h3>
                                <p class="text-xs text-slate-500">Switch between light and dark mode</p>
                            </div>
                            <button onclick="toggleTheme()" class="px-4 py-2 bg-slate-100 dark:bg-slate-800 rounded-xl text-xs font-medium capitalize">
                                ${Store.state.theme} Mode
                            </button>
                        </div>

                        <div class="pt-4 border-t border-slate-100 dark:border-slate-800 flex items-center justify-between">
                            <div>
                                <h3 class="font-bold text-slate-900 dark:text-white text-sm">Reset Local Progress</h3>
                                <p class="text-xs text-slate-500">Clear all bookmarks, favorites, and completed lessons</p>
                            </div>
                            <button onclick="resetProgressData()" class="px-4 py-2 bg-rose-50 dark:bg-rose-950/50 text-rose-600 rounded-xl text-xs font-semibold">
                                Reset Data
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function resetProgressData() {
            if (confirm('Are you sure you want to reset all your progress and bookmarks?')) {
                localStorage.clear();
                location.reload();
            }
        }

        // Global Search Modal Engine
        function openSearchModal() {
            let modal = document.getElementById('search-modal');
            if (modal) modal.remove();

            const container = document.getElementById('search-modal-container');
            container.innerHTML = `
                <div id="search-modal" class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-start justify-center pt-20 p-4 animate-fade-in" onclick="closeSearchModal(event)">
                    <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 w-full max-w-xl rounded-3xl shadow-2xl overflow-hidden" onclick="event.stopPropagation()">
                        <div class="p-4 border-b border-slate-100 dark:border-slate-800 flex items-center gap-3">
                            <svg class="w-5 h-5 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
                            <input type="text" id="global-search-input" autofocus placeholder="Search subjects, lessons, and content..." oninput="executeGlobalSearch(this.value)" class="w-full bg-transparent text-slate-900 dark:text-white text-sm focus:outline-none">
                            <button onclick="document.getElementById('search-modal').remove()" class="text-xs text-slate-400 hover:text-slate-600 px-2 py-1 bg-slate-100 dark:bg-slate-800 rounded-lg">ESC</button>
                        </div>
                        <div id="search-results-container" class="max-h-96 overflow-y-auto p-4 space-y-2">
                            <p class="text-xs text-center text-slate-400 py-6">Type to start searching across all reviewer data...</p>
                        </div>
                    </div>
                </div>
            `;
        }

        function closeSearchModal(e) {
            const modal = document.getElementById('search-modal');
            if (modal) modal.remove();
        }

        function executeGlobalSearch(query) {
            const resContainer = document.getElementById('search-results-container');
            if (!query || query.trim().length === 0) {
                resContainer.innerHTML = `<p class="text-xs text-center text-slate-400 py-6">Type to start searching across all reviewer data...</p>`;
                return;
            }

            const q = query.toLowerCase();
            const subjects = window.reviewerData.subjects || [];
            let results = [];

            subjects.forEach(sub => {
                if (sub.name.toLowerCase().includes(q) || (sub.description && sub.description.toLowerCase().includes(q))) {
                    results.push({ type: 'Subject', title: sub.name, subId: sub.id || sub.name });
                }
                if (sub.lessons) {
                    sub.lessons.forEach(les => {
                        if (les.title.toLowerCase().includes(q) || (les.description && les.description.toLowerCase().includes(q))) {
                            results.push({ type: 'Lesson', title: les.title, subId: sub.id || sub.name, lesId: les.id || les.title });
                        }
                    });
                }
            });

            if (results.length === 0) {
                resContainer.innerHTML = `<p class="text-xs text-center text-slate-400 py-6">No matching results found for "${query}"</p>`;
                return;
            }

            resContainer.innerHTML = results.map(r => `
                <div onclick="document.getElementById('search-modal').remove(); ${r.type === 'Subject' ? `navigate('lessons', { subjectId: '${r.subId}' })` : `navigate('lesson-detail', { subjectId: '${r.subId}', lessonId: '${r.lesId}' })`}" class="p-3 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl cursor-pointer flex items-center justify-between transition-colors">
                    <div>
                        <span class="text-[10px] font-semibold text-brand-600 dark:text-brand-400 uppercase">${r.type}</span>
                        <h4 class="font-bold text-slate-900 dark:text-white text-sm">${r.title}</h4>
                    </div>
                    <span class="text-xs text-slate-400">→</span>
                </div>
            `).join('');
        }

        // Toggle Helpers
        function toggleTheme() {
            Store.state.theme = Store.state.theme === 'dark' ? 'light' : 'dark';
            Store.save();
            applyTheme();
            renderShell();
            renderCurrentView();
        }

        function toggleBookmark(type, id) {
            const list = Store.state.bookmarks[type];
            if (list.includes(id)) {
                Store.state.bookmarks[type] = list.filter(item => item !== id);
                showToast('Bookmark removed', 'info');
            } else {
                list.push(id);
                showToast('Bookmark added successfully', 'success');
            }
            Store.save();
        }

        function toggleFavorite(type, id) {
            const list = Store.state.favorites[type];
            if (list.includes(id)) {
                Store.state.favorites[type] = list.filter(item => item !== id);
                showToast('Removed from favorites', 'info');
            } else {
                list.push(id);
                showToast('Added to favorites', 'success');
            }
            Store.save();
        }

        // Empty State Helper
        function renderEmptyState(title, desc, actionText, actionFn = '') {
            return `
                <div class="flex flex-col items-center justify-center py-16 px-6 text-center animate-fade-in">
                    <div class="w-16 h-16 bg-slate-100 dark:bg-slate-800 text-slate-400 rounded-3xl flex items-center justify-center text-2xl mb-4">📂</div>
                    <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-1">${title}</h3>
                    <p class="text-xs text-slate-500 dark:text-slate-400 max-w-sm mb-6">${desc}</p>
                    ${actionFn ? `<button onclick="${actionFn}" class="px-5 py-2.5 bg-brand-600 text-white font-medium rounded-xl text-xs shadow-md">${actionText}</button>` : ''}
                </div>
            `;
        }

        function setupKeyboardShortcuts() {
            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                    e.preventDefault();
                    openSearchModal();
                }
            });
        }
    </script>
</body>
</html>
